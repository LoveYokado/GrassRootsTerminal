[supervisord]
nodaemon=true ; デーモンで起動させずにフォアグラウンドで起動させる
logfile=/dev/stdout ; supervisord自身のログを標準出力へ
logfile_maxbytes=0 ; ログローテーションを無効化
loglevel=info ; (supervisordのログレベルを指定. デフォルトは info レベル; その他: debug, warn, trace)

[program:gunicorn]
command=gunicorn -c gunicorn.conf.py src.app:app
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
